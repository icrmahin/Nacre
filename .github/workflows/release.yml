name: Build and publish Nacre VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source and tests
        run: |
          npm run validate
          npm test
          node --check extension.js
          node --check systemAccent.js
          node --check syntaxAccent.js

      - name: Determine and verify release version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must be run from the main branch."
              echo "Selected ref: $GITHUB_REF"
              exit 1
            fi
            TAG="v$VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          TAG_VERSION="${TAG#v}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json is $VERSION but tag is $TAG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Preparing Nacre $VERSION ($TAG)"

      - name: Package release VSIX
        run: npx --yes @vscode/vsce package --out "./icrmahin.nacre-${{ steps.version.outputs.version }}.vsix"

      - name: Create GitHub Release and attach VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "./icrmahin.nacre-${{ steps.version.outputs.version }}.vsix" \
            --title "Nacre ${{ steps.version.outputs.version }}" \
            --generate-notes
