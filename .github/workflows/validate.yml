name: Validate Nacre

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate extension metadata and assets
        run: npm run validate
      - name: Run unit tests
        run: npm test
      - name: Check extension JavaScript syntax
        run: |
          node --check extension.js
          node --check systemAccent.js
